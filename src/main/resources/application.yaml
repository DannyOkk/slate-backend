spring:
  application:
    name: slate-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

jwt:
  secret: ${JWT_SECRET:claveSecretaSuperSeguraParaDesarrolloLocal123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 horas por defecto

spring.jpa.open-in-view: false

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR